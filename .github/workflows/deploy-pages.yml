# Site CI/CD on GitHub Pages: git push -> production.
# - PRs and pushes get a typecheck+build verification (no deploy on PRs).
# - Push to master deploys dist/ to Pages.
# - SPA trick: GitHub Pages has no rewrites, so index.html is copied
#   to 404.html; deep links like /booking and /admin keep working.
# - IMPORTANT: Vite bakes VITE_* at BUILD time. Set them as repo
#   Variables (Settings -> Secrets and variables -> Actions -> Variables),
#   otherwise the deployed site runs in localStorage demo mode.
name: Site CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Выравниваем npm с локальной разработкой (11.x): разные мажоры
      # по-разному резолвят транзитивные зависимости, и строгий npm ci
      # падает на расхождении. npm install самодолечивает lock при дрейфе.
      - run: npm install -g npm@11
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_USE_SUPABASE: ${{ vars.VITE_USE_SUPABASE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_BUSINESS_SLUG: ${{ vars.VITE_BUSINESS_SLUG }}
          VITE_FEATURED_SLUG: ${{ vars.VITE_FEATURED_SLUG }}
          VITE_BUSINESS_TIMEZONE: ${{ vars.VITE_BUSINESS_TIMEZONE }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
