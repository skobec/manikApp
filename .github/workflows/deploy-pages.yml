# Site CI/CD on GitHub Pages: git push -> production.
# - PRs and pushes get a typecheck+build verification (no deploy on PRs).
# - Push to master deploys dist/ to Pages.
# - SPA trick: GitHub Pages has no rewrites, so index.html is copied
#   to 404.html; deep links like /booking and /admin keep working.
# - IMPORTANT: Vite bakes VITE_* at BUILD time. Set them as repo
#   Variables (Settings -> Secrets and variables -> Actions -> Variables),
#   otherwise the deployed site runs in localStorage demo mode.
name: Site CI/CD

on:
  # Сборка проверяется сразу после пуша в ЛЮБУЮ ветку.
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Выравниваем npm с локальной разработкой (11.x): разные мажоры
      # по-разному резолвят транзитивные зависимости, и строгий npm ci
      # падает на расхождении. npm install самодолечивает lock при дрейфе.
      - run: npm install -g npm@11
      - run: npm install --no-audit --no-fund
      # Сборка под подпуть Pages (/user/repo/): base берётся из имени
      # репозитория автоматически — переименование репо ничего не ломает.
      - run: npm run build:pages
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_USE_SUPABASE: ${{ vars.VITE_USE_SUPABASE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_BUSINESS_SLUG: ${{ vars.VITE_BUSINESS_SLUG }}
          VITE_FEATURED_SLUG: ${{ vars.VITE_FEATURED_SLUG }}
          VITE_BUSINESS_TIMEZONE: ${{ vars.VITE_BUSINESS_TIMEZONE }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Публикация — только с master (и не из PR).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Дымовой тест живого сайта: ловит класс проблем "задеплоилось не то"
  # (пустые vars, битый base, мёртвый фолбэк) — именно с этим мы боролись.
  smoke:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: |
          ORIGIN="https://${{ github.repository_owner }}.github.io"
          BASE="$ORIGIN/${{ github.event.repository.name }}"
          # Ждём, пока CDN отдаст свежий деплой (до ~2 минут).
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/index.html -w "%{http_code}" "$BASE/")
            [ "$code" = "200" ] && break
            sleep 20
          done
          test "$code" = "200"
          # Глубокие ссылки: Pages отдаёт SPA-фолбэк со статусом 404 —
          # проверяем тело (оболочку приложения), а не статус.
          for p in booking login admin; do
            body=$(curl -s "$BASE/$p")
            echo "$body" | grep -q 'id="app"' || (echo "no app shell at /$p" && exit 1)
          done
          # Переменные запечены? Если в сборке нет URL Supabase — билд
          # ехал с пустыми vars, роняем пайплайн сразу, а не ждём жалоб.
          ASSET=$(grep -o '/[^"]*assets/index-[^"]*\.js' /tmp/index.html | head -1)
          curl -s "$ORIGIN$ASSET" -o /tmp/app.js
          if [ -n "${{ vars.VITE_SUPABASE_URL }}" ]; then
            HOST=$(echo "${{ vars.VITE_SUPABASE_URL }}" | sed 's|https://||')
            grep -q "$HOST" /tmp/app.js || (echo "Supabase URL not baked into bundle!" && exit 1)
          fi
          echo "SMOKE OK"
